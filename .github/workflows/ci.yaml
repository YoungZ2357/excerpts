name: CI Pipeline
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow}}-${{github.ref}}

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
